<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>건강보험료 계산기 - Multi-tools</title>
<link rel="stylesheet" href="../style.css?v=5" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="../index.html">&larr; 목록으로</a>
    <h1>🏥 건강보험료 계산기</h1>
    <p class="subtitle">연 소득을 입력하면 2026년 기준 건강보험료와 장기요양보험료를 계산해줘요</p>

    <div class="card">
      <div class="mode-toggle" id="modeToggle">
        <button type="button" class="mode-btn active" data-mode="employee">직장가입자</button>
        <button type="button" class="mode-btn" data-mode="regional">지역가입자</button>
      </div>

      <label for="incomeInput" id="incomeLabel">보수월액 (월급)</label>
      <input type="text" id="incomeInput" placeholder="예: 3,000,000" inputmode="numeric" />
      <div class="hint" id="incomeHint">비과세 소득을 뺀 월 급여를 입력하세요</div>

      <div id="propertyFields" class="field-group" hidden>
        <label for="propertyInput">재산 과세표준 합계 (선택)</label>
        <input type="text" id="propertyInput" placeholder="예: 180,000,000" inputmode="numeric" />
        <div class="hint">주택·토지·건물의 재산세 과세표준 합계예요. 재산세 고지서에서 확인할 수 있고, 주택은 대략 공시가격의 60%예요</div>

        <label for="depositInput">전월세 보증금 (선택)</label>
        <input type="text" id="depositInput" placeholder="예: 50,000,000" inputmode="numeric" />

        <label for="rentInput">월세 (선택)</label>
        <input type="text" id="rentInput" placeholder="예: 500,000" inputmode="numeric" />
        <div class="hint">세 들어 사는 경우 (보증금 + 월세 × 40) × 30%를 재산으로 쳐요</div>
      </div>

      <button id="calcBtn">계산하기</button>

      <div class="error" id="errorBox"></div>

      <div class="result" id="resultBox">
        <div class="label" id="resultLabel">월 납부액 (본인 부담)</div>
        <div class="value" id="resultValue">-</div>
        <div class="breakdown" id="breakdownText"></div>
      </div>
    </div>

    <p class="footnote" id="footnote"></p>
  </div>

  <script>
    const modeToggle = document.getElementById('modeToggle');
    const incomeInput = document.getElementById('incomeInput');
    const incomeLabel = document.getElementById('incomeLabel');
    const incomeHint = document.getElementById('incomeHint');
    const calcBtn = document.getElementById('calcBtn');
    const resultBox = document.getElementById('resultBox');
    const errorBox = document.getElementById('errorBox');
    const resultLabel = document.getElementById('resultLabel');
    const resultValue = document.getElementById('resultValue');
    const breakdownText = document.getElementById('breakdownText');
    const footnote = document.getElementById('footnote');
    const propertyFields = document.getElementById('propertyFields');
    const propertyInput = document.getElementById('propertyInput');
    const depositInput = document.getElementById('depositInput');
    const rentInput = document.getElementById('rentInput');

    // 2026년 기준
    const HEALTH_RATE = 0.0719;        // 건강보험료율
    const LTC_RATE = 0.009448;         // 장기요양보험료율 (소득 대비)
    const EMPLOYEE_MIN = 20160;        // 직장 보수월액보험료 하한 (전체)
    const EMPLOYEE_MAX = 9183480;      // 직장 보수월액보험료 상한 (전체)
    const REGIONAL_MIN = 20160;        // 지역 월별 보험료 하한
    const REGIONAL_MAX = 4591740;      // 지역 월별 보험료 상한
    const POINT_VALUE = 211.5;         // 재산보험료 부과점수당 금액
    const PROPERTY_DEDUCTION = 100000000; // 재산 기본공제 1억원

    // 재산보험료 부과점수표 (국민건강보험법 시행령 별표 4) — [공제 후 재산 상한(만원), 점수]
    const PROPERTY_SCORES = [
      [450, 22], [900, 44], [1350, 66], [1800, 97], [2250, 122],
      [2700, 146], [3150, 171], [3600, 195], [4050, 219], [4500, 244],
      [5020, 268], [5590, 294], [6220, 320], [6930, 344], [7710, 365],
      [8590, 386], [9570, 412], [10700, 439], [11900, 465], [13300, 490],
      [14800, 516], [16400, 535], [18300, 559], [20400, 586], [22700, 611],
      [25300, 637], [28100, 659], [31300, 681], [34900, 706], [38800, 731],
      [43200, 757], [48100, 785], [53600, 812], [59700, 841], [66500, 881],
      [74000, 921], [82400, 961], [91800, 1001], [103000, 1041], [114000, 1091],
      [127000, 1141], [142000, 1191], [158000, 1241], [176000, 1291], [196000, 1341],
      [218000, 1391], [242000, 1451], [270000, 1511], [300000, 1571], [330000, 1641],
      [363000, 1711], [399300, 1781], [439230, 1851], [483153, 1921], [531468, 1991],
      [584615, 2061], [643077, 2131], [707385, 2201], [778124, 2271], [Infinity, 2341],
    ];

    let mode = 'employee'; // 'employee' | 'regional'

    const MODE_CONFIG = {
      employee: {
        label: '연봉 (연간 보수)',
        placeholder: '예: 36,000,000',
        hint: '비과세 소득을 뺀 연간 급여를 입력하세요. 12로 나눈 보수월액으로 계산해요',
        errorMessage: '연봉을 입력해주세요.',
        resultLabel: '월 납부액 (본인 부담)',
        footnote: '💡 직장가입자는 보험료를 회사와 절반씩 나눠 내요. 2026년 건강보험료율 7.19%, 장기요양보험료율 0.9448% 기준이에요.',
      },
      regional: {
        label: '연 소득',
        placeholder: '예: 30,000,000',
        hint: '사업·이자·배당·연금 등 연간 소득을 입력하세요. 12로 나눈 소득월액으로 계산해요',
        errorMessage: '연 소득을 입력해주세요.',
        resultLabel: '월 납부액',
        footnote: '💡 지역가입자는 보험료 전액을 본인이 내요. 재산은 기본공제 1억원을 뺀 뒤 등급별 점수 × 211.5원으로 계산해요.',
      },
    };

    // 보험료는 10원 미만 절사
    function floor10(n) {
      return Math.floor(n / 10) * 10;
    }

    function clamp(n, min, max) {
      return Math.min(Math.max(n, min), max);
    }

    function formatWon(n) {
      return Math.round(n).toLocaleString('ko-KR') + '원';
    }

    function formatAmountInput(value) {
      const digits = value.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    for (const input of [incomeInput, propertyInput, depositInput, rentInput]) {
      input.addEventListener('input', () => {
        input.value = formatAmountInput(input.value);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') calculate();
      });
    }

    function parseAmount(input) {
      return Number(input.value.replace(/,/g, '')) || 0;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
      resultBox.classList.remove('visible');
    }

    function setMode(newMode) {
      mode = newMode;
      const config = MODE_CONFIG[mode];

      [...modeToggle.children].forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      incomeLabel.textContent = config.label;
      incomeInput.placeholder = config.placeholder;
      incomeHint.textContent = config.hint;
      resultLabel.textContent = config.resultLabel;
      footnote.textContent = config.footnote;
      propertyFields.hidden = mode !== 'regional';

      for (const input of [incomeInput, propertyInput, depositInput, rentInput]) input.value = '';
      errorBox.classList.remove('visible');
      resultBox.classList.remove('visible');
    }

    modeToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (!btn) return;
      setMode(btn.dataset.mode);
    });

    function calcEmployee(income) {
      const raw = income * HEALTH_RATE;
      const limit = raw < EMPLOYEE_MIN ? ' (하한 적용)' : raw > EMPLOYEE_MAX ? ' (상한 적용)' : '';
      const totalHealth = floor10(clamp(raw, EMPLOYEE_MIN, EMPLOYEE_MAX));
      const health = floor10(totalHealth / 2);
      const ltc = floor10(health * (LTC_RATE / HEALTH_RATE));

      resultValue.textContent = formatWon(health + ltc);
      breakdownText.innerHTML =
        '보수월액: ' + formatWon(income) + '<br />' +
        '건강보험료 (3.595%): ' + formatWon(health) + limit + '<br />' +
        '장기요양보험료: ' + formatWon(ltc) + '<br />' +
        '회사 부담분: ' + formatWon(health + ltc) + '<br />' +
        '합계 (본인 + 회사): ' + formatWon((health + ltc) * 2) + '<br />' +
        '연간 본인 부담액: ' + formatWon((health + ltc) * 12);
    }

    // 공제 후 재산(원)에 해당하는 부과점수
    function propertyScore(amount) {
      if (amount <= 0) return 0;
      const man = amount / 10000;
      return PROPERTY_SCORES.find(([max]) => man <= max)[1];
    }

    function calcRegional(income) {
      const rentAsProperty = (parseAmount(depositInput) + parseAmount(rentInput) * 40) * 0.3;
      const property = parseAmount(propertyInput) + rentAsProperty;
      const taxable = Math.max(property - PROPERTY_DEDUCTION, 0);
      const score = propertyScore(taxable);

      const rawIncome = income * HEALTH_RATE;
      const incomePart = floor10(Math.max(rawIncome, REGIONAL_MIN));
      const propertyPart = floor10(score * POINT_VALUE);
      const sum = incomePart + propertyPart;
      const health = Math.min(sum, REGIONAL_MAX);
      const ltc = floor10(health * (LTC_RATE / HEALTH_RATE));

      const minNote = rawIncome < REGIONAL_MIN ? ' (최저보험료 적용)' : '';
      const maxNote = sum > REGIONAL_MAX ? ' (상한 적용)' : '';

      resultValue.textContent = formatWon(health + ltc);
      breakdownText.innerHTML =
        '소득월액: ' + formatWon(income) + '<br />' +
        '소득분 보험료 (7.19%): ' + formatWon(incomePart) + minNote + '<br />' +
        (property > 0
          ? '재산 합계: ' + formatWon(property) + ' → 공제 후 ' + formatWon(taxable) + '<br />' +
            '재산분 보험료 (' + score.toLocaleString('ko-KR') + '점 × 211.5원): ' + formatWon(propertyPart) + '<br />'
          : '') +
        '건강보험료 합계: ' + formatWon(health) + maxNote + '<br />' +
        '장기요양보험료: ' + formatWon(ltc) + '<br />' +
        '연간 납부액: ' + formatWon((health + ltc) * 12);
    }

    function calculate() {
      const annual = parseFloat(incomeInput.value.replace(/,/g, ''));
      const income = annual / 12; // 월 기준 금액

      errorBox.classList.remove('visible');

      if (isNaN(annual)) {
        showError(MODE_CONFIG[mode].errorMessage);
        return;
      }

      if (mode === 'employee') calcEmployee(income);
      else calcRegional(income);

      resultBox.classList.add('visible');
    }

    calcBtn.addEventListener('click', calculate);

    setMode('employee');
  </script>
</body>
</html>
