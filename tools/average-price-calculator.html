<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>주식 평단가 계산기 - Multi-tools</title>
<link rel="stylesheet" href="../style.css" />
<style>
  .mode-btn {
    margin-top: 0;
  }

  .buy-header,
  .buy-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 36px;
    gap: 8px;
    align-items: center;
  }

  .buy-header {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .buy-row + .buy-row {
    margin-top: 8px;
  }

  .remove-btn {
    width: 36px;
    height: 40px;
    margin: 0;
    padding: 0;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 1.1rem;
    font-weight: 400;
  }

  .remove-btn:hover {
    background: #fef2f2;
    border-color: #fecaca;
    color: #b91c1c;
  }

  .add-btn {
    margin-top: 10px;
    padding: 9px;
    background: #fff;
    border: 1px dashed var(--accent);
    color: var(--accent);
    font-size: 0.88rem;
  }

  .add-btn:hover {
    background: #eff6ff;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 22px 0 18px;
  }

  .profit {
    color: #dc2626;
  }

  .loss {
    color: #2563eb;
  }
</style>
</head>
<body>
  <div class="page">
    <a class="back-link" href="../index.html">&larr; 목록으로</a>
    <h1>📈 주식 평단가 계산기</h1>
    <p class="subtitle">평가금액·수익률로 평단가를 찾고, 추가 매수 후 평단가와 목표 평단가까지 필요한 수량도 계산해줘요</p>

    <div class="card">
      <div class="mode-toggle" id="modeToggle">
        <button type="button" class="mode-btn active" data-mode="reverse">평단가 찾기</button>
        <button type="button" class="mode-btn" data-mode="average">추가 매수</button>
        <button type="button" class="mode-btn" data-mode="target">목표 평단가</button>
      </div>

      <div id="reverseSection">
        <label for="evalAmount">현재 평가금액</label>
        <input type="text" id="evalAmount" placeholder="예: 1,300,000" inputmode="decimal" />
        <div class="hint">증권 앱에 나오는 이 종목의 평가금액을 입력하세요</div>

        <label for="evalRate">현재 수익률 (%)</label>
        <input type="number" id="evalRate" placeholder="예: 8.5 (손실이면 -12)" inputmode="decimal" step="any" />
        <div class="hint">수익 중이면 양수, 손실 중이면 음수로 입력하세요</div>

        <label for="evalQty">보유 수량</label>
        <input type="text" id="evalQty" placeholder="예: 20" inputmode="decimal" />
      </div>

      <div id="holdSection" hidden>
        <label for="holdPrice">현재 평단가</label>
        <input type="text" id="holdPrice" placeholder="예: 72,000" inputmode="decimal" />

        <label for="holdQty">보유 수량</label>
        <input type="text" id="holdQty" placeholder="예: 10" inputmode="decimal" />
        <div class="hint" id="holdHint">처음 매수라면 두 칸 모두 비워두세요</div>
      </div>

      <div id="targetSection" hidden>
        <hr class="divider" />

        <label for="buyPrice">매수 예정가</label>
        <input type="text" id="buyPrice" placeholder="예: 60,000" inputmode="decimal" />
        <div class="hint">추가로 살 가격 (보통 현재가)</div>

        <label for="targetPrice">목표 평단가</label>
        <input type="text" id="targetPrice" placeholder="예: 65,000" inputmode="decimal" />
        <div class="hint">현재 평단가와 매수 예정가 사이의 값이어야 해요</div>
      </div>

      <div id="averageSection" hidden>
        <hr class="divider" />
  
        <label>추가 매수</label>
        <div class="buy-header">
          <span>매수가</span>
          <span>수량</span>
          <span></span>
        </div>
        <div id="buyList"></div>
        <button type="button" class="add-btn" id="addBtn">+ 매수 추가</button>
  
        <hr class="divider" />
  
        <label for="currentPrice">현재가 (선택)</label>
        <input type="text" id="currentPrice" placeholder="예: 65,000" inputmode="decimal" />
        <div class="hint">입력하면 평가손익과 수익률도 함께 보여줘요</div>
      </div>

      <button id="calcBtn">계산하기</button>

      <div class="error" id="errorBox"></div>

      <div class="result" id="resultBox">
        <div class="label" id="resultLabel">평단가</div>
        <div class="value" id="avgValue">-</div>
        <div class="breakdown" id="breakdownText"></div>
      </div>
    </div>
  </div>

  <script>
    const holdPriceInput = document.getElementById('holdPrice');
    const holdQtyInput = document.getElementById('holdQty');
    const currentPriceInput = document.getElementById('currentPrice');
    const buyPriceInput = document.getElementById('buyPrice');
    const targetPriceInput = document.getElementById('targetPrice');
    const modeToggle = document.getElementById('modeToggle');
    const holdHint = document.getElementById('holdHint');
    const averageSection = document.getElementById('averageSection');
    const targetSection = document.getElementById('targetSection');
    const reverseSection = document.getElementById('reverseSection');
    const holdSection = document.getElementById('holdSection');
    const evalAmountInput = document.getElementById('evalAmount');
    const evalRateInput = document.getElementById('evalRate');
    const evalQtyInput = document.getElementById('evalQty');
    const resultLabel = document.getElementById('resultLabel');
    const buyList = document.getElementById('buyList');
    const addBtn = document.getElementById('addBtn');
    const calcBtn = document.getElementById('calcBtn');
    const resultBox = document.getElementById('resultBox');
    const errorBox = document.getElementById('errorBox');
    const avgValue = document.getElementById('avgValue');
    const breakdownText = document.getElementById('breakdownText');

    // 소수점 둘째 자리까지 표시 (해외주식·소수점 매수 대응)
    function formatNum(n) {
      return n.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    }

    function formatAmountInput(value) {
      const cleaned = value.replace(/[^0-9.]/g, '');
      const [intRaw, ...rest] = cleaned.split('.');
      const intPart = intRaw.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      const decPart = rest.length > 0 ? '.' + rest.join('').slice(0, 4) : '';
      return intPart + decPart;
    }

    // 빈 칸이면 null, 숫자가 아니면 NaN
    function readNum(input) {
      const raw = input.value.replace(/,/g, '').trim();
      return raw === '' ? null : parseFloat(raw);
    }

    function bindInput(input) {
      input.addEventListener('input', () => {
        input.value = formatAmountInput(input.value);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') calculate();
      });
    }

    function addBuyRow() {
      const row = document.createElement('div');
      row.className = 'buy-row';

      const price = document.createElement('input');
      price.type = 'text';
      price.className = 'buy-price';
      price.placeholder = '매수가';
      price.inputMode = 'decimal';

      const qty = document.createElement('input');
      qty.type = 'text';
      qty.className = 'buy-qty';
      qty.placeholder = '수량';
      qty.inputMode = 'decimal';

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove-btn';
      remove.textContent = '×';
      remove.title = '삭제';
      remove.addEventListener('click', () => {
        if (buyList.children.length > 1) {
          row.remove();
        } else {
          price.value = '';
          qty.value = '';
        }
      });

      [price, qty].forEach(bindInput);
      row.append(price, qty, remove);
      buyList.append(row);
      return price;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
      resultBox.classList.remove('visible');
    }

    let mode = 'reverse'; // 'reverse' | 'average' | 'target'

    const MODE_CONFIG = {
      reverse: {
        holdHint: '',
        resultLabel: '평단가',
      },
      average: {
        holdHint: '처음 매수라면 두 칸 모두 비워두세요',
        resultLabel: '평단가',
      },
      target: {
        holdHint: '지금 보유 중인 평단가와 수량을 입력하세요',
        resultLabel: '추가로 사야 할 수량',
      },
    };

    function setMode(next) {
      mode = next;
      const config = MODE_CONFIG[mode];

      modeToggle.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      reverseSection.hidden = mode !== 'reverse';
      holdSection.hidden = mode === 'reverse';
      averageSection.hidden = mode !== 'average';
      targetSection.hidden = mode !== 'target';
      holdHint.textContent = config.holdHint;
      resultLabel.textContent = config.resultLabel;

      errorBox.classList.remove('visible');
      resultBox.classList.remove('visible');
    }

    function calculate() {
      errorBox.classList.remove('visible');
      if (mode === 'reverse') {
        calculateReverse();
      } else if (mode === 'target') {
        calculateTarget();
      } else {
        calculateAverage();
      }
    }

    // 평가금액 = 매입금액 × (1 + 수익률)  →  평단가 = 평가금액 ÷ (1 + 수익률) ÷ 수량
    function calculateReverse() {
      const evalAmount = readNum(evalAmountInput);
      const evalQty = readNum(evalQtyInput);
      const rateRaw = evalRateInput.value.trim();
      const rate = rateRaw === '' ? null : parseFloat(rateRaw);

      if ([evalAmount, rate, evalQty].some((n) => n === null)) {
        showError('평가금액, 수익률, 보유 수량을 모두 입력해주세요.');
        return;
      }
      if (isNaN(evalAmount) || isNaN(rate) || isNaN(evalQty) || evalAmount <= 0 || evalQty <= 0) {
        showError('평가금액과 보유 수량은 0보다 큰 숫자여야 합니다.');
        return;
      }

      const divisor = 1 + rate / 100;
      if (divisor <= 0) {
        showError('수익률이 -100% 이하일 수는 없어요. 입력값을 확인해주세요.');
        return;
      }

      const totalCost = evalAmount / divisor;
      const avg = totalCost / evalQty;
      const pnl = evalAmount - totalCost;
      const cls = pnl > 0 ? 'profit' : pnl < 0 ? 'loss' : '';
      const sign = pnl > 0 ? '+' : '';

      avgValue.textContent = formatNum(avg);
      breakdownText.innerHTML =
        '총 매입금액: ' + formatNum(totalCost) + '<br />' +
        '현재가 (평가금액 ÷ 수량): ' + formatNum(evalAmount / evalQty) + '<br />' +
        '평가손익: <span class="' + cls + '">' + sign + formatNum(pnl) + '</span>' +
        '<br /><br />증권 앱의 수익률은 반올림된 값이라 실제 평단가와 약간 차이가 날 수 있어요';
      resultBox.classList.add('visible');
    }

    // 목표 평단가 T까지 맞추려면 가격 P에 몇 주를 더 사야 하는지
    // (A × Q + P × n) / (Q + n) = T  →  n = Q × (A − T) / (T − P)
    function calculateTarget() {
      const holdPrice = readNum(holdPriceInput);
      const holdQty = readNum(holdQtyInput);
      const buyPrice = readNum(buyPriceInput);
      const targetPrice = readNum(targetPriceInput);

      if ([holdPrice, holdQty, buyPrice, targetPrice].some((n) => n === null)) {
        showError('현재 평단가, 보유 수량, 매수 예정가, 목표 평단가를 모두 입력해주세요.');
        return;
      }
      if ([holdPrice, holdQty, buyPrice, targetPrice].some((n) => isNaN(n) || n <= 0)) {
        showError('모든 값은 0보다 큰 숫자여야 합니다.');
        return;
      }
      if (targetPrice === holdPrice) {
        showError('이미 목표 평단가예요. 더 살 필요가 없어요.');
        return;
      }
      if (buyPrice === holdPrice) {
        showError('매수 예정가가 현재 평단가와 같으면 몇 주를 사도 평단가가 그대로예요.');
        return;
      }
      // 평단가는 기존 평단가와 매수가 사이에서만 움직임
      if ((targetPrice - holdPrice) * (targetPrice - buyPrice) >= 0) {
        showError(
          '목표 평단가는 현재 평단가(' + formatNum(holdPrice) + ')와 매수 예정가(' +
          formatNum(buyPrice) + ') 사이여야 해요.'
        );
        return;
      }

      const exactQty = (holdQty * (holdPrice - targetPrice)) / (targetPrice - buyPrice);
      // 부동소수 오차로 1주가 더 붙지 않도록 살짝 깎고 올림
      const wholeQty = Math.ceil(exactQty - 1e-9);
      const buyCost = buyPrice * wholeQty;
      const totalQty = holdQty + wholeQty;
      const totalCost = holdPrice * holdQty + buyCost;
      const newAvg = totalCost / totalQty;

      let html =
        '필요 매수금액: ' + formatNum(buyCost) + '<br />' +
        '매수 후 평단가: ' + formatNum(holdPrice) + ' → ' + formatNum(newAvg) + '<br />' +
        '매수 후 총 수량: ' + formatNum(totalQty) + '주<br />' +
        '매수 후 총 매입금액: ' + formatNum(totalCost);

      if (wholeQty !== exactQty) {
        html += '<br /><br />소수점 매수라면 ' + formatNum(exactQty) + '주 (' +
          formatNum(buyPrice * exactQty) + ')로 목표에 딱 맞출 수 있어요';
      }

      avgValue.textContent = formatNum(wholeQty) + '주';
      breakdownText.innerHTML = html;
      resultBox.classList.add('visible');
    }

    function calculateAverage() {

      const lots = [];

      const holdPrice = readNum(holdPriceInput);
      const holdQty = readNum(holdQtyInput);
      if ((holdPrice === null) !== (holdQty === null)) {
        showError('현재 평단가와 보유 수량을 함께 입력하거나 둘 다 비워주세요.');
        return;
      }
      if (holdPrice !== null) {
        lots.push({ price: holdPrice, qty: holdQty, label: '현재 평단가와 보유 수량' });
      }

      const rows = buyList.querySelectorAll('.buy-row');
      for (let i = 0; i < rows.length; i++) {
        const price = readNum(rows[i].querySelector('.buy-price'));
        const qty = readNum(rows[i].querySelector('.buy-qty'));
        if (price === null && qty === null) continue;
        if (price === null || qty === null) {
          showError(`${i + 1}번째 추가 매수의 매수가와 수량을 모두 입력해주세요.`);
          return;
        }
        lots.push({ price, qty, label: `${i + 1}번째 추가 매수` });
      }

      for (const lot of lots) {
        if (isNaN(lot.price) || isNaN(lot.qty) || lot.price <= 0 || lot.qty <= 0) {
          showError(`${lot.label}: 0보다 큰 숫자를 입력해주세요.`);
          return;
        }
      }

      if (lots.length === 0) {
        showError('보유 내역이나 추가 매수를 하나 이상 입력해주세요.');
        return;
      }

      const totalQty = lots.reduce((sum, l) => sum + l.qty, 0);
      const totalCost = lots.reduce((sum, l) => sum + l.price * l.qty, 0);
      const avg = totalCost / totalQty;

      let html =
        '총 수량: ' + formatNum(totalQty) + '주<br />' +
        '총 매입금액: ' + formatNum(totalCost);

      if (holdPrice !== null && lots.length > 1) {
        const diff = avg - holdPrice;
        const diffRate = (diff / holdPrice) * 100;
        html += '<br />평단가 변화: ' + formatNum(holdPrice) + ' → ' + formatNum(avg) +
          ' (' + (diff >= 0 ? '+' : '') + formatNum(diffRate) + '%)';
      }

      const currentPrice = readNum(currentPriceInput);
      if (currentPrice !== null) {
        if (isNaN(currentPrice) || currentPrice <= 0) {
          showError('현재가는 0보다 큰 숫자여야 합니다.');
          return;
        }
        const evalAmount = currentPrice * totalQty;
        const pnl = evalAmount - totalCost;
        const pnlRate = (pnl / totalCost) * 100;
        const cls = pnl > 0 ? 'profit' : pnl < 0 ? 'loss' : '';
        const sign = pnl > 0 ? '+' : '';
        html +=
          '<br /><br />평가금액: ' + formatNum(evalAmount) +
          '<br />평가손익: <span class="' + cls + '">' + sign + formatNum(pnl) +
          ' (' + sign + formatNum(pnlRate) + '%)</span>';
      }

      avgValue.textContent = formatNum(avg);
      breakdownText.innerHTML = html;
      resultBox.classList.add('visible');
    }

    addBtn.addEventListener('click', () => addBuyRow().focus());
    calcBtn.addEventListener('click', calculate);
    [holdPriceInput, holdQtyInput, currentPriceInput, buyPriceInput, targetPriceInput, evalAmountInput, evalQtyInput].forEach(bindInput);
    evalRateInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') calculate();
    });
    modeToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (btn) setMode(btn.dataset.mode);
    });

    addBuyRow();
  </script>
</body>
</html>
